# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Anti-DoS: rate limits per client IP (or user when logged in).
    rate_limiter:
        search:
            policy: 'fixed_window'
            limit: 30
            interval: '1 minute'
        profile_autosave:
            policy: 'fixed_window'
            limit: 12
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        cache:
            # In-memory cache for tests: no persisted pool files between runs
            # (home stats/tag cloud would otherwise leak across test runs).
            app: cache.adapter.array
